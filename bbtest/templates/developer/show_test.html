{% extends './developer_base_2.html' %}
{% load i18n static %}

{% block title %}{% blocktrans with section_name=section_name code=code|upper context 'Page title' %}{{ section_name }} (Test #{{ code }}){% endblocktrans %}{% endblock %}

{% block content %}
    <script>
        moduleDataStack.push({
            module: "ReactModule",
            data: {
                class: "DeveloperTest",
                props: {
                    spinnerLogo: "{% static 'img/logo.png' %}"
                }
            }
        });
    </script>
    <div id="root">
        <div class="row">
            <div class="col-xs-12 bb-developer-container">
                <img class="bb-spinner" src="{% static 'img/logo.png' %}">
            </div>
        </div>
    </div>
{% endblock %}
