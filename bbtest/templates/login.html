{% load i18n %}
<h1>{% trans 'Login page' context 'Login page header' %}</h1>
<form method="post" action="{% url 'bbtest:login' %}">
    {% csrf_token %}
    <input type="hidden" name="r" value="{{ r }}">
    {{ form }}
    <input type="submit" value="{% trans 'Login' context 'Login page submit button' %}">
</form>
