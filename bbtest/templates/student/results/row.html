{% load i18n %}
<div class="panel">
    <div class="bb-accordion-panel-heading {% if is_first %}bb-accordion-panel-heading-first{% endif %}">
        <div class="row">
            <div class="col-xs-12 col-sm-4 bb-result-cell">
                <span>{% trans quiz.test.section.name %}</span>
                <a href="#bb-results-{{ parent_index }}-{{ index }}" class="bb-accordion-toggle collapsed pull-right visible-xs-block" data-toggle="collapse" data-parent="#bb-results-{{ parent_index }}">
                    <i class="fa fa-fw fa-chevron-up"></i>
                </a>
            </div>
            <div class="col-xs-3 col-sm-2 bb-chart bb-result-cell" data-dashboard-table-chart-0></div>
            <div class="col-xs-6 col-sm-3 bb-chart bb-result-cell" data-dashboard-table-chart-columns-0></div>
            <div class="col-xs-3 col-sm-2 bb-chart bb-result-cell" data-dashboard-table-chart-avg-0></div>
            <div class="col-sm-1 bb-result-cell hidden-xs">
                <a href="#bb-results-{{ parent_index }}-{{ index }}" class="bb-accordion-toggle collapsed pull-right" data-toggle="collapse" data-parent="#bb-results-{{ parent_index }}">
                    <i class="fa fa-fw fa-chevron-up"></i>
                </a>
            </div>
        </div>
    </div>
    <div class="collapse" id="bb-results-{{ parent_index }}-{{ index }}">
        <div class="bb-accordion-panel-body">
            <div class="row">
                <div class="col-xs-12 col-sm-5">
                    <div class="bb-chart bb-chart-history" data-history-chart-0></div>
                </div>
                <div class="col-xs-12 col-sm-7">
                    <ul class="nav nav-tabs">
                        {% for i in 'xxxxx' %}
                            <li class="{% if forloop.first %}active{% endif %}"><a href="#bb-results-{{ parent_index }}-{{ index }}-section-{{ forloop.counter0 }}" data-toggle="tab">Tab {{ forloop.counter }}</a></li>
                        {% endfor %}
                    </ul>
                    <div class="tab-content">
                        {% for i in 'xxxxx' %}
                            <div class="tab-pane fade {% if forloop.first %}active in{% endif %}" id="bb-results-{{ parent_index }}-{{ index }}-section-{{ forloop.counter0 }}">
                                <div class="row mt-15 mb-15">
                                    <div class="col-xs-4 col-sm-3 col-sm-offset-1 col-md-2 col-md-offset-2 bb-result-cell"></div>
                                    <div class="col-xs-8 col-sm-7 col-md-6 bb-result-cell"></div>
                                </div>
                                <p>{% lorem 1 b random %}</p>
                            </div>
                        {% endfor %}
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
