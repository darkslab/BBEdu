{% extends '../personalized_base_1.html' %}
{% load i18n static permission pagination %}

{% block extended_footer %}

{% endblock %}

{% block title %}
  {% trans 'Dashboard' context 'Page title' %}
{% endblock %}

{% block content %}
  <script>
    moduleDataStack.push({
      module: "ReactModule",
        data: {
            class: "ChartDashboard",
            props: {
                hasTimer: true,
                secondsLeft: 60,
                students: {{ students| safe }},
                scores_data: {{ scoresData| safe }},
                subject_list: {{ subject_list| safe }},
                mean_subj: {{ mean_subj| safe }},
                subject_topics: {{ subject_topics| safe }},
                subject_scores: {{ subject_scores| safe }},

                subject_chart_height: {{ subject_chart_height| safe }},
                //objectClass: "ResultTestObject",
                texts: {
                    error:                        "{% trans 'There was an error, please reload the page.'  context 'Exam' %}",
                }
            }
        }
  });
</script>
  <style>
    canvas {
      display: block;
      margin: 0 0;
    }
  </style>
  <div id="root" class="mb-10">
    <div class="row">
      <div class="col-xs-12 bb-test-container">
        <img class="bb-spinner" src="{% static 'img/logo2_spinner.png' %}" />
      </div>
    </div>
  </div>
{% endblock %}
