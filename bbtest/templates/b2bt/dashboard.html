{% extends '../personalized_base_1.html' %}
{% load i18n static permission pagination %}

{% block extended_footer %}

{% endblock %}

{% comment %} {% block title %}
  {% trans 'Dashboard' context 'Page title' %}
{% endblock %} {% endcomment %}

{% block content %}
  <script>
    moduleDataStack.push({
      module: "ReactModule",
        data: {
            class: "ChartDashboard",
            props: {
                student_name_list: {{ student_name_list | safe}},
                parent_list: {{ parent_list | safe}},
                parent_to_children_list: {{ parent_to_children_list | safe}},
                parent_average_scores: {{ parent_average_scores | safe}},
                parent_student_scores: {{ parent_student_scores | safe}},
                // map_key_to_id: {{ map_key_to_id | safe}},
                map_id_to_key: {{ map_id_to_key | safe}},

                subject_chart_height: {{ subject_chart_height | safe}},
                texts: {
                    error:                        "{% trans 'There was an error, please reload the page.'  context 'Exam' %}",
                }
            }
        }
  });
</script>
  <style>
    canvas {
      display: block;
      margin: 0 0;
    }
  </style>
  <div id="root" class="mb-10 watermarked-content">
    <div class="row">
      <div class="col-xs-12 bb-test-container">
        <img class="bb-spinner" src="{% static 'img/logo2_spinner.png' %}" />
      </div>
    </div>
  </div>
{% endblock %}
