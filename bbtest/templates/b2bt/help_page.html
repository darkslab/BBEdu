{% extends '../personalized_base_1.html' %}
{% load i18n static permission pagination %}

{% block extended_footer %}{% endblock %}

{% block title %}
  {% trans 'Help B2BTeacher' context 'Page title' %}
{% endblock %}

{% block content %}
  <div class="row">
    <div class="col-xs-12 bb-test-container">
      <div class="embed-responsive embed-responsive-16by9 mb-23" >
        <div style="max-width: 560px; margin: auto;">
          <iframe 
              width="560" 
              height="315" 
              src="https://www.youtube.com/embed/{{ youtube_video_id }}" 
              title="YouTube video player" 
              frameborder="0" 
              allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
              allowfullscreen>
          </iframe>
        </div>
      </div>
    </div>
  </div>
{% endblock %}
